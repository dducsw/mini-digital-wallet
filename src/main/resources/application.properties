spring.application.name=mini-digital-wallet

# Server port
server.port=8080

# PostgreSQL Datasource
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5436/wallet_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgrespassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway Migration
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JWT Security (no hardcoded secret: set APP_JWT_SECRET env, fail-fast at startup if missing)
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-ms=${APP_JWT_REFRESH_EXPIRATION_MS:604800000}

# Phase 4 reconciliation: nightly 2am by default (cron sec min hour dom month dow)
app.reconciliation.cron=${APP_RECONCILIATION_CRON:0 0 2 * * *}

# Phase 8 transaction limits (cents): $10,000 per tx, $50,000 daily
app.limits.max-amount-per-tx=${APP_LIMITS_MAX_AMOUNT_PER_TX:1000000}
app.limits.daily-max-amount=${APP_LIMITS_DAILY_MAX_AMOUNT:5000000}

