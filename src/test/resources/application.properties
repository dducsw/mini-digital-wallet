spring.application.name=mini-digital-wallet-test

# H2 In-Memory Database in PostgreSQL compatibility mode
spring.datasource.url=jdbc:h2:mem:ledger_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate for Test
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Disable Flyway for unit tests using H2 schema generation
spring.flyway.enabled=false
